<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hollawall.46.250.238.167.nip.io
    DocumentRoot /var/www/hollawall-command-center
    DirectoryIndex index.html

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/hollawall.46.250.238.167.nip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hollawall.46.250.238.167.nip.io/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/hollawall-command-center>
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Hollawall Private Preview"
        AuthUserFile /etc/apache2/.htpasswd-hollawall-preview
        Require valid-user
        FallbackResource /index.html
    </Directory>

    <FilesMatch "\.html$">
        Header always set Cache-Control "private, no-store"
    </FilesMatch>
    <FilesMatch "\.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$">
        Header always set Cache-Control "private, max-age=86400"
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/hollawall-command-center-error.log
    CustomLog ${APACHE_LOG_DIR}/hollawall-command-center-access.log combined
</VirtualHost>
</IfModule>
