# Private owner-scoped Hollawall Financial Command Center preview.
<VirtualHost *:80>
    ServerName hollawall.46.250.238.167.nip.io

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/hollawall-command-center-error.log
    CustomLog ${APACHE_LOG_DIR}/hollawall-command-center-access.log combined
</VirtualHost>
