name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_DOTENV_DISABLED: "1"
  STATE_STORE_BACKEND: local
  STATE_STORE_REQUIRED: "0"
  DURABLE_INBOX_REQUIRED: "0"
  LEDGER_STORE_BACKEND: off
  LEDGER_READ_BACKEND: off

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install and build test fixtures
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.2 playwright==1.55.0 openpyxl==3.1.5
      - name: Compile backend
        run: python -m compileall -q -x '(^|/)(archive|tests|output|tmp|artifacts|dashboard|node_modules)/' .
      - name: Backend tests
        run: python -m pytest -q tests --ignore=tests/browser -o addopts=''

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
          coverage: none
      - name: Install browser stack
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          python -m pip install -r requirements.txt pytest==9.0.2 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser E2E
        run: >-
          python -m pytest -q
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_cashflow_and_wallet_routes_are_operational_and_paginated
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_mobile_project_detail_keeps_title_actions_and_ledger_fully_usable
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_owner_review_route_is_read_only_and_responsive
          -o addopts=''

  visual:
    name: visual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install visual stack
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          python -m pip install -r requirements.txt pytest==9.0.2 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Visual and responsive acceptance
        run: >-
          python -m pytest -q
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_dark_routes_keep_readable_text_contrast
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_light_filled_color_surfaces_use_white_text
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_responsive_matrix_keeps_page_gutters_and_routes_inside_viewport
          -o addopts=''

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit==2.10.0 bandit==1.9.4 ruff==0.14.2
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Security lint
        run: >-
          python -m bandit -r
          agent_core dashboard_api handlers layers services utils scripts main.py sheets_helper.py
          --severity-level medium --confidence-level medium
      - name: Static lint
        run: python -m ruff check . --select E9,F63,F7,F82 --exclude archive --exclude tests --exclude output --exclude tmp --exclude artifacts --exclude dashboard --exclude node_modules
      - name: Release hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
          git diff --check

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --omit=optional --audit-level=high

  postgresql:
    name: postgresql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hollawall_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: hollawall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hollawall_test -d hollawall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PROJECT_DOCUMENT_TEST_DATABASE_URL: postgresql://hollawall_test:ci_test_only@127.0.0.1:5432/hollawall_test
      INBOX_REVIEW_TEST_DATABASE_URL: postgresql://hollawall_test:ci_test_only@127.0.0.1:5432/hollawall_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.2
      - name: PostgreSQL authority tests
        run: |
          python -m pytest -q \
            tests/project_document_postgres_integration_test.py \
            tests/project_document_service_postgres_test.py \
            tests/inbox_review_postgres_test.py \
            tests/canonical_financial_schema_test.py \
            -o addopts=''

  php:
    name: php
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
          coverage: none
      - name: PHP syntax
        run: git ls-files '*.php' | xargs -r -n1 php -l

  container:
    name: container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build --tag hollawall-ci:${GITHUB_SHA} .
      - name: Start production image
        run: |
          docker run --detach --rm --name hollawall-ci \
            --publish 127.0.0.1:18000:8000 \
            --env GROQ_API_KEY=verification-placeholder \
            --env PYTHON_DOTENV_DISABLED=1 \
            --env STATE_STORE_BACKEND=local \
            --env STATE_STORE_REQUIRED=0 \
            --env DURABLE_INBOX_REQUIRED=0 \
            --env LEDGER_STORE_BACKEND=off \
            --env LEDGER_READ_BACKEND=off \
            hollawall-ci:${GITHUB_SHA}
      - name: Verify health and non-root runtime
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/tmp/health.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text())
          assert payload.get('status') in {'healthy', 'degraded'}, payload
          PY
              test "$(docker exec hollawall-ci id -u)" != "0"
              exit 0
            fi
            sleep 2
          done
          docker logs hollawall-ci
          exit 1
      - name: Stop production image
        if: always()
        run: docker stop hollawall-ci >/dev/null 2>&1 || true

  performance:
    name: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Cache and bundle budgets
        run: |
          python -m pip install -r requirements.txt pytest==9.0.2
          python -m pytest -q tests/sheets_cache_test.py -o addopts=''
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          python - <<'PY'
          from pathlib import Path
          assets = [p for p in Path('dashboard/dist/assets').glob('*') if p.is_file()]
          total = sum(p.stat().st_size for p in assets)
          largest = max((p.stat().st_size for p in assets), default=0)
          assert total <= 4_500_000, total
          assert largest <= 3_000_000, largest
          print({'asset_bytes': total, 'largest_asset_bytes': largest})
          PY

  accessibility:
    name: accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install accessibility stack
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard
          python -m pip install -r requirements.txt pytest==9.0.2 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Accessibility acceptance
        run: >-
          python -m pytest -q
          tests/presensi_release_test.py::PresensiReleaseTests::test_employee_primary_actions_use_accessible_ink_on_orange
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_mobile_light_and_dark_navigation
          tests/browser/dashboard_visual_acceptance_test.py::DashboardVisualAcceptanceTests::test_light_filled_color_surfaces_use_white_text
          -o addopts=''
