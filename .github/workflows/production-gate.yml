name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_DOTENV_DISABLED: "1"
  STATE_STORE_BACKEND: local
  STATE_STORE_REQUIRED: "0"
  DURABLE_INBOX_REQUIRED: "0"
  LEDGER_STORE_BACKEND: off
  LEDGER_READ_BACKEND: off

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Build dashboard fixture used by backend tests
        run: npm run build --prefix dashboard

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2 playwright==1.55.0 openpyxl==3.1.5 pip-audit==2.10.0 bandit==1.9.4 ruff==0.14.2

      - name: Compile backend
        run: python -m compileall -q -x '(^|/)(archive|tests|output|tmp|artifacts|dashboard|node_modules)/' .

      - name: Backend tests
        run: python -m pytest -q tests --ignore=tests/browser -o addopts=''

      - name: Browser acceptance dependencies
        run: python -m playwright install --with-deps chromium

      - name: Browser acceptance tests
        run: python -m pytest -q tests/browser -o addopts=''

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Security lint
        run: python -m bandit -r . -x archive,tests,output,tmp,artifacts,dashboard,node_modules,.venv --severity-level medium --confidence-level medium

      - name: Static lint
        run: python -m ruff check . --select E9,F63,F7,F82 --exclude archive --exclude tests --exclude output --exclude tmp --exclude artifacts --exclude dashboard --exclude node_modules

  dashboard:
    name: Dashboard tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Dashboard tests
        run: npm test

      - name: Dashboard production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=high

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hollawall_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: hollawall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hollawall_test -d hollawall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PROJECT_DOCUMENT_TEST_DATABASE_URL: postgresql://hollawall_test:ci_test_only@127.0.0.1:5432/hollawall_test
      INBOX_REVIEW_TEST_DATABASE_URL: postgresql://hollawall_test:ci_test_only@127.0.0.1:5432/hollawall_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.2

      - name: Run PostgreSQL authority tests
        run: |
          python -m pytest -q \
            tests/project_document_postgres_integration_test.py \
            tests/project_document_service_postgres_test.py \
            tests/inbox_review_postgres_test.py \
            -o addopts=''

  container:
    name: Production container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --tag hollawall-ci:${GITHUB_SHA} .

      - name: Start production image
        run: |
          docker run --detach --rm --name hollawall-ci \
            --publish 127.0.0.1:18000:8000 \
            --env GROQ_API_KEY=verification-placeholder \
            --env PYTHON_DOTENV_DISABLED=1 \
            --env STATE_STORE_BACKEND=local \
            --env STATE_STORE_REQUIRED=0 \
            --env DURABLE_INBOX_REQUIRED=0 \
            --env LEDGER_STORE_BACKEND=off \
            --env LEDGER_READ_BACKEND=off \
            hollawall-ci:${GITHUB_SHA}

      - name: Verify container health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/tmp/health.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text())
          assert payload.get('status') in {'healthy', 'degraded'}, payload
          print('container_health=ok')
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs hollawall-ci
          exit 1

      - name: Verify non-root runtime
        run: test "$(docker exec hollawall-ci id -u)" != "0"

      - name: Stop production image
        if: always()
        run: docker stop hollawall-ci >/dev/null 2>&1 || true

  diff:
    name: Release hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check committed whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
          git diff --check
