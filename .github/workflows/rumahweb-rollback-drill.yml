name: Rumahweb Isolated Rollback Drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RW_FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
      RW_FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
      RW_FTP_PASSWORD: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute isolated rollback drill
        run: python scripts/rumahweb_rollback_drill.py --evidence /tmp/rollback-drill.json
      - uses: actions/upload-artifact@v4
        with:
          name: rumahweb-rollback-drill
          path: /tmp/rollback-drill.json
          retention-days: 30
