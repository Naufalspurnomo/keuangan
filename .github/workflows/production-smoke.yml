name: Production Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: false

env:
  BACKEND_ORIGIN: https://renewed-loreen-hollawalls-8d8f6f5c.koyeb.app
  SITE_ORIGIN: https://hollawall.com
  INCIDENT_TITLE: "[production-smoke] Hollawall production acceptance failed"
  WHATSAPP_PROVIDER_EXPECTED_OFF: "1"

jobs:
  smoke:
    name: Live production acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check public surfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            --proto '=https' --tlsv1.2 \
            -o /tmp/dashboard.html \
            -w 'dashboard_http=%{http_code}\n' \
            "$SITE_ORIGIN/admin/"
          grep -q 'Hollawall' /tmp/dashboard.html

          curl --fail --silent --show-error --location --max-time 20 \
            --proto '=https' --tlsv1.2 \
            -o /tmp/presensi.html \
            -w 'presensi_http=%{http_code}\n' \
            "$SITE_ORIGIN/absen/presensi/"
          grep -Eqi 'Hollawall|Presensi' /tmp/presensi.html

      - name: Check anonymous denial
        run: |
          set -euo pipefail
          for url in \
            "$SITE_ORIGIN/admin/api/snapshot.php" \
            "$SITE_ORIGIN/admin/api/inbox-reviews.php?action=list" \
            "$BACKEND_ORIGIN/api/dashboard/v1/inbox/reviews"
          do
            code=$(curl --silent --show-error --max-time 20 \
              --proto '=https' --tlsv1.2 \
              --output /tmp/denial-body \
              --write-out '%{http_code}' \
              "$url")
            case "$code" in
              401|403) ;;
              *) echo "anonymous access was not denied: $url ($code)" >&2; exit 1 ;;
            esac
          done

      - name: Check authenticated Rumahweb snapshot proxy
        env:
          HOLLAWALL_LIVE_API_PROXY_TOKEN: ${{ secrets.HOLLAWALL_LIVE_API_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            --proto '=https' --tlsv1.2 \
            -H "X-Hollawall-Proxy-Token: ${HOLLAWALL_LIVE_API_PROXY_TOKEN}" \
            -o /tmp/snapshot-health.json \
            -w 'snapshot_proxy_health_http=%{http_code}\\n' \
            "$SITE_ORIGIN/admin/api/snapshot-health.php"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/snapshot-health.json').read_text())
          assert payload == {
              'ok': True,
              'snapshot_version': 'dashboard.snapshot.v1',
              'upstream_status': 200,
          }, payload
          print('authenticated_snapshot_proxy=ok')
          PY

      - name: Check backend health, snapshot, and release provenance
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          DASHBOARD_ACTOR_ASSERTION_SECRET: ${{ secrets.HOLLAWALL_DASHBOARD_ACTOR_ASSERTION_SECRET }}
          DASHBOARD_ACTOR_ASSERTION_AUDIENCE: hollawall-finance-api
          HOLLAWALL_OWNER_EMAIL: ${{ vars.HOLLAWALL_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --proto '=https' --tlsv1.2 \
            -o /tmp/health.json \
            -w 'backend_http=%{http_code}\n' \
            "$BACKEND_ORIGIN/health"
          curl --fail --silent --show-error --max-time 20 \
            --proto '=https' --tlsv1.2 \
            -o /tmp/release.json \
            -w 'release_http=%{http_code}\n' \
            "$BACKEND_ORIGIN/api/health/release"
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import time
          from pathlib import Path

          now = int(time.time())
          claims = {
              'actor_id': os.environ['HOLLAWALL_OWNER_EMAIL'].strip().casefold(),
              'email': os.environ['HOLLAWALL_OWNER_EMAIL'].strip().casefold(),
              'role': 'boss',
              'aud': os.environ['DASHBOARD_ACTOR_ASSERTION_AUDIENCE'],
              'iat': now,
              'exp': now + 60,
              'method': 'GET',
              'path': '/api/dashboard/v1/snapshot',
              'body_sha256': hashlib.sha256(b'').hexdigest(),
              'nonce': secrets.token_hex(16),
          }
          encode = lambda value: base64.urlsafe_b64encode(value).decode().rstrip('=')
          encoded = encode(json.dumps(claims, separators=(',', ':')).encode())
          signature = encode(hmac.new(
              os.environ['DASHBOARD_ACTOR_ASSERTION_SECRET'].encode(),
              encoded.encode(),
              hashlib.sha256,
          ).digest())
          Path('/tmp/snapshot-assertion').write_text(encoded + '.' + signature)
          PY
          curl --fail --silent --show-error --max-time 30 \
            --proto '=https' --tlsv1.2 \
            -H "X-Hollawall-Actor-Assertion: $(</tmp/snapshot-assertion)" \
            -o /tmp/snapshot.json \
            -w 'snapshot_http=%{http_code}\n' \
            "$BACKEND_ORIGIN/api/dashboard/v1/snapshot"
          rm -f /tmp/snapshot-assertion
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/health.json').read_text())
          release = json.loads(Path('/tmp/release.json').read_text())
          snapshot = json.loads(Path('/tmp/snapshot.json').read_text())
          expected = os.environ['EXPECTED_RELEASE_SHA'].strip().lower()
          actual = str(release.get('release_sha') or '').strip().lower()
          assert expected and actual == expected, {'expected': expected, 'actual': actual}
          provider = payload.get('whatsapp_provider', {})
          provider_expected_off = os.environ.get('WHATSAPP_PROVIDER_EXPECTED_OFF') == '1'
          if provider_expected_off:
              assert payload.get('status') in {'healthy', 'degraded'}, payload
              assert provider.get('reachable') is False, payload
              assert provider.get('connected') is False, payload
              assert provider.get('logged_in') is False, payload
              if provider.get('configured') is True:
                  assert provider.get('state') in {'unreachable', 'unknown'}, payload
              else:
                  assert provider.get('configured') is False, payload
                  assert provider.get('state') in {'disabled', 'unconfigured'}, payload
          else:
              assert payload.get('status') == 'healthy', payload
              assert provider.get('reachable') is True, payload
              assert provider.get('connected') is True, payload
              assert provider.get('logged_in') is True, payload
          inbox = payload.get('transaction_inbox', {})
          assert inbox.get('durable') is True, payload
          backlog = inbox.get('backlog')
          needs_review = inbox.get('needs_review')
          assert isinstance(backlog, int) and not isinstance(backlog, bool) and backlog >= 0, payload
          assert needs_review == backlog, payload
          assert inbox.get('review_writes_enabled') is True, payload
          assert inbox.get('review_schema_ready') is True, payload
          assert inbox.get('review_audit_ready') is True, payload
          assert snapshot.get('version') == 'dashboard.snapshot.v1', snapshot
          assert isinstance(snapshot.get('meta'), dict), snapshot
          assert isinstance(snapshot.get('transactions'), list), snapshot
          assert isinstance(snapshot.get('wallets'), list), snapshot
          print('production_acceptance=ok')
          PY

      - name: Close recovered incident
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INCIDENT_TITLE: ${{ env.INCIDENT_TITLE }}
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter(item => !item.pull_request && item.title === process.env.INCIDENT_TITLE)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INCIDENT_TITLE: ${{ env.INCIDENT_TITLE }}
        with:
          script: |
            const body = [
              'The scheduled Hollawall production acceptance check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit expected in production: ${context.sha}`,
              '',
              'This issue is deduplicated and will close automatically after a green smoke run.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(item => !item.pull_request && item.title === process.env.INCIDENT_TITLE);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: process.env.INCIDENT_TITLE,
                body,
              });
            }
