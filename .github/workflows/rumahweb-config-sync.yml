name: Deploy Gombloh Project

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollawall-gombloh-project
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Deploy bilingual Gombloh project article
        env:
          RW_FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
          RW_FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
          RW_FTP_PASSWORD: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/deploy_gombloh.py --evidence /tmp/gombloh.json
          python - <<'PY'
          import json
          evidence = json.load(open('/tmp/gombloh.json'))
          assert evidence['success'] is True, evidence
          assert evidence['runner_removed'] is True, evidence
          assert evidence['status'] == 'publish', evidence
          assert evidence['slug'] == 'gombloh-sang-musisi-legendaris', evidence
          assert evidence['translation_count'] >= 6, evidence
          assert evidence['featured_media'] > 0, evidence
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gombloh-${{ github.run_id }}
          path: /tmp/gombloh.json
          if-no-files-found: warn
          retention-days: 30
