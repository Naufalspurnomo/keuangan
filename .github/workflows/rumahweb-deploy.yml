name: Rumahweb Production Deploy

on:
  workflow_run:
    workflows: ["Production Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact main commit to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rumahweb-production
  cancel-in-progress: false

env:
  PYTHON_DOTENV_DISABLED: "1"

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve production revision
        id: revision
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          revision="${WORKFLOW_SHA:-${MANUAL_SHA:-}}"
          test -n "$revision"
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 2

      - name: Require exact main revision
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build immutable release pair
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --prefix dashboard
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              commit = json.load(response)
          parents = commit.get('parents') or []
          if not parents:
              raise SystemExit('release commit has no parent')
          locks = {}
          for relative in ('requirements.txt', 'dashboard/package-lock.json'):
              locks[relative] = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
          payload = {
              'schema': 'hollawall.release-provenance/v1',
              'required_baseline_sha': sha,
              'implementation_head_sha': sha,
              'parent_sha': parents[0]['sha'],
              'dirty': False,
              'submodules': [],
              'dependency_lockfiles': locks,
              'candidate_diff': f'{sha}..{sha}',
          }
          Path('/tmp/provenance.json').write_text(json.dumps(payload, sort_keys=True) + '\n')
          PY
          python scripts/build_rumahweb_admin_release.py \
            --provenance /tmp/provenance.json \
            --artifact-revision "$RELEASE_SHA"
          python scripts/build_rumahweb_presensi_release.py \
            --provenance /tmp/provenance.json \
            --artifact-revision "$RELEASE_SHA"

      - name: Atomically deploy verified release pair
        env:
          RW_FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
          RW_FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
          RW_FTP_PASSWORD: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          python scripts/deploy_rumahweb_presensi_atomic.py \
            --admin-release artifacts/rumahweb-admin-release/admin \
            --absen-release artifacts/rumahweb-presensi-release/absen \
            --admin-remote public_html/admin \
            --absen-remote public_html/absen \
            --tag "${RELEASE_SHA:0:12}" \
            --evidence /tmp/rumahweb-deploy.json
          python - <<'PY'
          import json
          evidence = json.load(open('/tmp/rumahweb-deploy.json'))
          assert evidence['success'] is True, evidence
          for release in ('admin', 'absen'):
              item = evidence['releases'][release]
              assert item['staged_readback']['ok'] is True, item
              assert item['final_readback']['ok'] is True, item
          PY

      - name: Synchronize private finance routing
        env:
          RW_FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
          RW_FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
          RW_FTP_PASSWORD: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          DASHBOARD_ACTOR_ASSERTION_SECRET: ${{ secrets.HOLLAWALL_DASHBOARD_ACTOR_ASSERTION_SECRET }}
        run: |
          set -euo pipefail
          python scripts/configure_rumahweb_admin_finance.py \
            --evidence /tmp/rumahweb-finance-config.json
          python - <<'PY'
          import json
          evidence = json.load(open('/tmp/rumahweb-finance-config.json'))
          assert evidence['success'] is True, evidence
          assert evidence['staged_readback'] is True, evidence
          assert evidence['final_readback'] is True, evidence
          assert evidence['secret_present'] is True, evidence
          assert evidence['secret_exposed'] is False, evidence
          PY

      - name: Verify public release identity
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          for path in admin absen; do
            for attempt in {1..18}; do
              curl --fail --silent --show-error \
                -H 'Cache-Control: no-cache' \
                "https://hollawall.com/${path}/release-manifest.json?sha=${RELEASE_SHA}" \
                -o "/tmp/${path}-release.json" || true
              if python - "$RELEASE_SHA" "/tmp/${path}-release.json" <<'PY'
          import json, pathlib, sys
          expected, path = sys.argv[1:]
          try:
              payload = json.loads(pathlib.Path(path).read_text())
          except Exception:
              raise SystemExit(1)
          observed = payload.get('artifact_revision') or payload.get('implementation_head_sha') or payload.get('release_sha')
          raise SystemExit(0 if observed == expected else 1)
          PY
              then
                break
              fi
              sleep 10
            done
            python - "$RELEASE_SHA" "/tmp/${path}-release.json" <<'PY'
          import json, pathlib, sys
          expected, path = sys.argv[1:]
          payload = json.loads(pathlib.Path(path).read_text())
          observed = payload.get('artifact_revision') or payload.get('implementation_head_sha') or payload.get('release_sha')
          assert observed == expected, (observed, expected, payload)
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rumahweb-deploy-${{ steps.revision.outputs.sha }}
          path: |
            /tmp/provenance.json
            /tmp/rumahweb-deploy.json
            /tmp/rumahweb-finance-config.json
            /tmp/admin-release.json
            /tmp/absen-release.json
          if-no-files-found: warn
          retention-days: 30
