name: Rumahweb Presensi Exact Cleanup

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: Exact comma-separated sent Presensi event IDs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rumahweb-presensi-private-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Transactionally remove exact verified acceptance events
        env:
          RW_FTP_HOST: ${{ secrets.RUMAHWEB_FTP_HOST }}
          RW_FTP_USER: ${{ secrets.RUMAHWEB_FTP_USER }}
          RW_FTP_PASSWORD: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          EVENT_IDS: ${{ inputs.event_ids }}
        run: |
          set -euo pipefail
          python scripts/cleanup_rumahweb_presensi_events.py \
            --event-ids "$EVENT_IDS" \
            --evidence /tmp/presensi-cleanup.json
          python - <<'PY'
          import json
          evidence = json.load(open('/tmp/presensi-cleanup.json'))
          assert evidence['success'] is True, evidence
          assert evidence['readback_clean'] is True, evidence
          assert evidence['removed_events'] == evidence['removed_photos'], evidence
          assert evidence['removed_events'] == len(evidence['removed_event_ids']), evidence
          assert evidence['credentials_exposed'] is False, evidence
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rumahweb-presensi-cleanup-${{ github.run_id }}
          path: /tmp/presensi-cleanup.json
          if-no-files-found: error
          retention-days: 30
